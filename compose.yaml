services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub-local
      POSTGRES_DB: penn_players
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d penn_players"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  hub-postgres:
